[book]
title = "Black Arrow"
description = "To-the-point notes and reference on ML performance engineering"
authors = ["deependujha"]
language = "en"
src = "src"

[build]
create-missing = false

[preprocessor.pagetoc]

[output.html]
sidebar-header-nav = false
additional-css = ["theme/pagetoc.css"]
additional-js = ["theme/pagetoc.js"]
site-url = "/black-arrow/"
git-repository-url = "https://github.com/deependujha/black-arrow"
edit-url-template = "https://github.com/deependujha/black-arrow/edit/main/{path}"

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 0

